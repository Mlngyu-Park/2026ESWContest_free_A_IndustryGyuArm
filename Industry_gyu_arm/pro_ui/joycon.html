<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조이콘 진단</title>
<link rel="stylesheet" href="/ui/app.css">
<style>
  body{overflow:auto}
  .wrap{max-width:820px;margin:0 auto;padding:24px}
  .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .axis{background:var(--card-2);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px}
  .axis .n{font-size:11px;color:var(--fg-3);margin-bottom:4px}
  .bar{height:5px;background:var(--card-3);border-radius:3px;margin-top:8px;
    position:relative;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent);
    display:block}
  .btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .b{padding:5px 9px;border-radius:6px;background:var(--card-2);
    border:1px solid var(--line);font-size:11px;color:var(--fg-3)}
  .b.on{background:var(--accent);border-color:var(--accent);color:#fff;
    font-weight:700}
  pre{background:var(--card-2);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px;font-size:11px;color:var(--fg-2);
    overflow-x:auto;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:20px;font-weight:750;margin-bottom:6px">조이콘 진단</h1>
  <p style="color:var(--fg-2);font-size:12.5px;margin-bottom:16px">
    조이콘의 아무 버튼이나 한 번 눌러야 브라우저가 인식합니다.
    (브라우저 보안 정책상 입력이 있어야 게임패드가 잡힙니다)</p>

  <div class="card">
    <h3>연결 상태</h3>
    <div class="big" id="conn">기다리는 중…</div>
    <div style="color:var(--fg-3);font-size:11.5px;margin-top:6px" id="idstr"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h3>축 (스틱 · IMU 후보)</h3>
    <div class="grid" id="axes"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h3>버튼</h3>
    <div class="btns" id="btns"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h3>원본 데이터</h3>
    <pre id="raw">—</pre>
  </div>
</div>
<script>
/* 조이콘이 브라우저에 어떤 값으로 들어오는지 그대로 보여준다.
   진단이 목적이므로 실패해도 이유가 화면에 남게 만든다. */
const $=s=>document.querySelector(s);
let lastCount=-1, frames=0;

/* getGamepads 는 반드시 navigator 에 바인딩해서 호출해야 한다
   (크롬에서 그냥 떼어 쓰면 Illegal invocation 오류가 난다) */
/* 닌텐도 조이콘만 고른다 (Vendor 057e).
   다른 기기(MATA STUDIO 등)가 함께 잡혀도 무시한다. */
const NINTENDO=/057e|joy-?con|nintendo|switch/i;
function isJoycon(gp){ return NINTENDO.test(gp.id||''); }

function pads(){
  try{
    if(!navigator.getGamepads) return {err:'이 브라우저는 게임패드 API 미지원'};
    const all=[...navigator.getGamepads()].filter(Boolean);
    return {list:all.filter(isJoycon), all};
  }catch(e){ return {err:'게임패드 읽기 오류: '+e.message}; }
}

addEventListener('gamepadconnected',e=>{
  if(!isJoycon(e.gamepad)) return;
  $('#conn').textContent='연결됨';
  $('#idstr').textContent=e.gamepad.id+'  (index '+e.gamepad.index+')';
});
addEventListener('gamepaddisconnected',()=>{
  $('#conn').textContent='끊김 — 버튼을 눌러보세요';
});

function loop(){
  frames++;
  const r=pads();
  if(r.err){
    $('#conn').textContent='사용 불가';
    $('#raw').textContent=r.err;
    return requestAnimationFrame(loop);
  }
  const list=r.list;
  if(list.length!==lastCount){
    lastCount=list.length;
    $('#axes').innerHTML=''; $('#btns').innerHTML='';   // 개수 바뀌면 다시 그림
  }
  if(!list.length){
    $('#conn').textContent='조이콘 대기 중 — 버튼/스틱을 움직이세요';
    $('#idstr').textContent='';
    $('#raw').textContent=
      '조이콘(닌텐도 057e) 없음.\n'
      +((r.all||[]).length?'다른 기기는 잡힘: '
         +(r.all||[]).map(g=>g.id).join(' / ')+'  (무시함)\n':'')
      +'· 크롬/엣지인지 확인 (파이어폭스는 조이콘 인식이 약함)\n'
      +'· 이 페이지를 한 번 클릭해 포커스를 준 뒤 버튼을 누르세요\n'
      +'· 스팀이 켜져 있으면 컨트롤러를 가로챕니다 (스팀 종료 후 재시도)\n'
      +'· 폴링 '+frames+'회 시도함';
    return requestAnimationFrame(loop);
  }

  const gp=list[0];
  $('#conn').textContent='연결됨';
  $('#idstr').textContent=gp.id+'  (index '+gp.index+')';

  /* 축 */
  const ae=$('#axes');
  if(ae.children.length!==gp.axes.length){
    ae.innerHTML='';
    gp.axes.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='axis';
      d.innerHTML='<div class="n">축 '+i+'</div>'
        +'<div class="v" style="font-size:17px;font-weight:700">0.000</div>'
        +'<div class="bar"><i></i></div>';
      ae.append(d);
    });
  }
  gp.axes.forEach((v,i)=>{
    const c=ae.children[i]; if(!c)return;
    c.querySelector('.v').textContent=v.toFixed(3);
    const bar=c.querySelector('.bar i');
    const w=Math.abs(v)*50;
    bar.style.width=w+'%';
    bar.style.left=(v<0?50-w:50)+'%';
  });

  /* 버튼 */
  const be=$('#btns');
  if(be.children.length!==gp.buttons.length){
    be.innerHTML='';
    gp.buttons.forEach((_,i)=>{
      const s=document.createElement('span');
      s.className='b'; s.textContent=i; be.append(s);
    });
  }
  gp.buttons.forEach((b,i)=>{
    const e=be.children[i]; if(e)e.classList.toggle('on',b.pressed);
  });

  /* 원본 */
  const pressed=gp.buttons.map((b,i)=>b.pressed?i:-1).filter(i=>i>=0);
  $('#raw').textContent=
    'id: '+gp.id
    +'\nmapping: '+(gp.mapping||'(표준 아님)')
    +'\n연결된 패드: '+list.length+'개'
    +'\naxes ('+gp.axes.length+'): ['+gp.axes.map(v=>v.toFixed(3)).join(', ')+']'
    +'\nbuttons ('+gp.buttons.length+'): 눌림 '
      +(pressed.length?pressed.join(', '):'없음');

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
