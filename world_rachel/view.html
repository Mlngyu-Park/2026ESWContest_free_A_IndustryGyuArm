<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월드 레이첼 — Spot 물리 걷기</title>
<script type="importmap">
{ "imports": { "three": "../duo_studio/web/vendor/three/three.module.js", "three/addons/": "../duo_studio/web/vendor/three/addons/" } }
</script>
<style>
  :root { --bg: #15171c; --panel: #1f232b; --line: #343a46; --text: #e6e9ef; --dim: #9aa3b2; --on: #f59e0b; --ok: #34d399; --bad: #f87171; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Noto Sans KR", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 250px; }
  #hud h1 { font-size: 15px; margin: 0 0 6px; }
  #hud .row { display: flex; justify-content: space-between; gap: 12px; color: var(--dim); }
  #hud .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #state.ok { color: var(--ok); } #state.bad { color: var(--bad); }
  #pad { position: fixed; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 64px); gap: 6px; }
  #pad button, #tools button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px; font: inherit; cursor: pointer; }
  #pad button.on { border-color: var(--on); color: var(--on); }
  #tools { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 250px); }
  #tools label { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .keys { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="hud">
  <h1>월드 레이첼 · Spot 물리 걷기</h1>
  <div class="row">두뇌 <b id="brain">불러오는 중…</b></div>
  <div class="row">상태 <b id="state">—</b></div>
  <div class="row">명령 (앞·옆·돌기) <b id="cmd">0 · 0 · 0</b></div>
  <div class="row">실제 <b id="real">0 · 0 · 0</b></div>
  <div class="row">몸통 높이 <b id="height">—</b></div>
  <div class="keys">W/S 앞뒤 · A/D 돌기 · Q/E 옆걸음 · 스페이스 멈춤 · P 밀기 · R 처음부터</div>
</div>
<div id="pad">
  <button data-k="q">↖ 옆</button><button data-k="w">▲ 앞</button><button data-k="e">옆 ↗</button>
  <button data-k="a">⟲ 돌기</button><button data-k=" ">■ 멈춤</button><button data-k="d">돌기 ⟳</button>
  <span></span><button data-k="s">▼ 뒤</button><span></span>
</div>
<div id="tools">
  <button id="push">툭 밀기 (P)</button>
  <button id="reset">처음부터 (R)</button>
  <span id="bodyBtns"></span>
  <button id="arm">팔 뻗기</button>
  <label><input type="checkbox" id="ai" checked> AI 켜기 (끄면 관절만 버팀)</label>
  <label><input type="checkbox" id="follow" checked> 카메라 따라가기</label>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import RAPIER from "../duo_studio/web/vendor/rapier/rapier.es.js";
import { SpotEnv, spotBlueprint, armLoad, ACT, CTRL_DT, ARM_SHELL } from "./spot_env.mjs";
import { Policy } from "./policy.mjs";
import { rpyT, Robot, READY, STOW, GRIP_CLOSED } from "../duo_studio/web/spotkin.js";

const $ = (s) => document.querySelector(s);
const A = "../duo_studio/web/assets/spot/";
const POLICY = new URLSearchParams(location.search).get("p") ?? "policies/latest.json";

// ── 장면 ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true;
$("#view").appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#15171c");
const Z = new THREE.Group(); scene.add(Z);                       // Z 가 위 (URDF 그대로)
Z.rotation.x = -Math.PI / 2;
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200); camera.position.set(2.2, 1.4, 2.2);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.4, 0);
scene.add(new THREE.HemisphereLight("#dfe7f5", "#30343c", 1.0));
const sun = new THREE.DirectionalLight("#ffffff", 1.6); sun.position.set(3, 6, 2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun, sun.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: "#23272f", roughness: 0.95 }));
floor.receiveShadow = true; Z.add(floor);
const grid = new THREE.GridHelper(200, 400, "#3b4250", "#2c313b"); grid.rotation.x = Math.PI / 2; grid.position.z = 0.001; Z.add(grid);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ── 로봇 ──
await RAPIER.init();
const model = await (await fetch(A + "robot.json")).json(), shapes = await (await fetch(A + "shapes.json")).json();
let PJ = null; try { PJ = await (await fetch(POLICY)).json(); } catch {}
const VER = PJ?.obs === 53 ? 2 : 1;
const bp = spotBlueprint(model, shapes, VER === 2 ? { armMass: ARM_SHELL } : {});
const env = new SpotEnv(RAPIER, bp, { train: false, maxT: 1e9, ver: VER });
const loader = new STLLoader(), linkObj = {};
await Promise.all(Object.entries(model.links).map(async ([name, L]) => {
  const g = new THREE.Group(); g.matrixAutoUpdate = false; linkObj[name] = g; Z.add(g);
  for (const v of L.visuals) {
    const geo = loader.parse(await (await fetch(A + v.mesh)).arrayBuffer()); geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: v.color || L.color, roughness: 0.5, metalness: 0.15 }));
    mesh.castShadow = true; mesh.matrixAutoUpdate = false; mesh.matrix.set(...rpyT(...v.rpy, v.xyz)); g.add(mesh);
  }
}));
let pol = null;
if (PJ) { pol = new Policy(PJ); $("#brain").textContent = `${POLICY.split("/").pop()} (v${VER})`; }
else { $("#brain").textContent = "없음 (관절만 버팀)"; $("#ai").checked = false; }

// ── 몸 자세 · 팔 (v2) ── 팔은 몸통 기준 계산(FK)으로 그리고, 무게는 '팔 무게 점' 으로 물리에 준다
const POSES = [["보통", { z: 0.52, pitch: 0 }], ["낮게", { z: 0.40, pitch: 0.12 }], ["가운데", { z: 0.44, pitch: 0.15 }], ["깊게 숙임", { z: 0.36, pitch: 0.35 }]];
const armRobot = new Robot(model); Object.assign(armRobot.q, STOW); armRobot.q.arm_f1x = GRIP_CLOSED;
let armU = 0, armGoal = 0;                                       // 0 = 접음, 1 = 뻗음
if (VER === 2) {
  for (const [name, P] of POSES) { const b = document.createElement("button"); b.textContent = name; b.onclick = () => { env.bodyGoal = { ...P }; }; $("#bodyBtns").appendChild(b); }
  $("#arm").onclick = () => { armGoal = 1 - armGoal; $("#arm").textContent = armGoal ? "팔 접기" : "팔 뻗기"; };
} else { $("#arm").style.display = "none"; }
function armPose(bodyT) {                                        // 팔 각도 = 접음↔뻗음 사이, 링크 행렬은 몸통 행렬 기준
  for (const n of Object.keys(STOW)) armRobot.q[n] = STOW[n] + (READY[n] - STOW[n]) * armU;
  return armRobot.fk(bodyT);
}

// ── 조작 ──
const held = new Set(), SPEED = { vx: 0.4, vy: 0.25, wz: 0.6 };
function cmdNow() {
  const k = (c) => held.has(c) ? 1 : 0;
  return [SPEED.vx * (k("w") - k("s") * 0.75), SPEED.vy * (k("q") - k("e")), SPEED.wz * (k("a") - k("d"))];
}
const press = (c, on) => { if (on) held.add(c); else held.delete(c); document.querySelectorAll(`#pad [data-k="${c === " " ? " " : c}"]`).forEach(b => b.classList.toggle("on", on)); };
addEventListener("keydown", (e) => {
  const c = e.key.toLowerCase();
  if ("wasdqe".includes(c) && c.length === 1) press(c, true);
  else if (c === " ") { held.clear(); document.querySelectorAll("#pad button").forEach(b => b.classList.remove("on")); e.preventDefault(); }
  else if (c === "p") push(); else if (c === "r") reset();
});
addEventListener("keyup", (e) => { const c = e.key.toLowerCase(); if ("wasdqe".includes(c) && c.length === 1) press(c, false); });
document.querySelectorAll("#pad button").forEach(b => {
  const c = b.dataset.k;
  b.addEventListener("pointerdown", () => { if (c === " ") { held.clear(); document.querySelectorAll("#pad button").forEach(x => x.classList.remove("on")); } else press(c, true); });
  for (const ev of ["pointerup", "pointerleave"]) b.addEventListener(ev, () => { if (c !== " ") press(c, false); });
});
function push() { const v = env.root.linvel(), a = Math.random() * 2 * Math.PI; env.root.setLinvel({ x: v.x + 0.6 * Math.cos(a), y: v.y + 0.6 * Math.sin(a), z: v.z }, true); }
let fallen = false;
function reset() { env.reset(); fallen = false; }
$("#push").onclick = push; $("#reset").onclick = reset;

// ── 돌리기: 화면 1장마다 AI 한 번 + 물리 4번 ──
const act = new Float32Array(ACT); let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= CTRL_DT) {
    acc -= CTRL_DT;
    env.cmd = cmdNow();
    if (VER === 2) {
      armU += Math.max(-CTRL_DT / 1.5, Math.min(CTRL_DT / 1.5, armGoal - armU));
      const Wl = armPose(rpyT(0, 0, 0, [0, 0, 0.52])), L = armLoad(bp, Wl, 0); env.setArmLoad(L.p, L.m);
    }
    if (pol && $("#ai").checked && !fallen) pol.act(env.observe(), act); else act.fill(0);
    const r = env.step(act);
    if (r.fell) fallen = true;
  }
  const L = env.linkMatrices();
  if (VER === 2) { const Wa = armPose(L[bp.root]); for (const n of Object.keys(Wa)) if (n.startsWith("arm_")) L[n] = Wa[n]; }
  for (const [n, g] of Object.entries(linkObj)) if (L[n]) { g.matrix.set(...L[n]); g.matrixWorldNeedsUpdate = true; }
  const p = env.root.translation(), q = env.root.rotation(), v = env.root.linvel(), w = env.root.angvel();
  const yaw = Math.atan2(2 * (q.w * q.z + q.x * q.y), 1 - 2 * (q.y * q.y + q.z * q.z)), c = Math.cos(yaw), s = Math.sin(yaw);
  const f = (x) => (x >= 0 ? " " : "") + x.toFixed(2);
  $("#cmd").textContent = env.cmd.map(f).join(" · ");
  $("#real").textContent = [v.x * c + v.y * s, -v.x * s + v.y * c, w.z].map(f).join(" · ");
  $("#height").textContent = p.z.toFixed(3) + " m";
  $("#state").textContent = fallen ? "넘어짐 — R 로 다시" : ($("#ai").checked && pol ? "AI 가 균형 잡는 중" : "AI 꺼짐");
  $("#state").className = fallen ? "bad" : "ok";
  if ($("#follow").checked) {                                   // 카메라: 로봇을 따라 같은 거리로
    const t = new THREE.Vector3(p.x, p.z, -p.y), d = t.clone().sub(controls.target);
    controls.target.add(d); camera.position.add(d);
    sun.position.set(t.x + 3, 6, t.z + 2); sun.target.position.copy(t);
  }
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.WR = { env, get pol() { return pol; }, push, reset };
</script>
</body>
</html>
